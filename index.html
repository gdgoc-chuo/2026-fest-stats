<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>fest-stats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='4' height='4' fill='%234285F4'/%3E%3Crect x='4' width='4' height='4' fill='%23EA4335'/%3E%3Crect y='4' width='4' height='4' fill='%23FBBC04'/%3E%3Crect x='4' y='4' width='4' height='4' fill='%2334A853'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&family=Noto+Sans+JP:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="stage">

  <section id="s-question" class="screen" hidden>
    <div class="top">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="prompt" id="prompt" role="heading" aria-level="1"></div>
    <div class="options" id="options" role="listbox"></div>
    <div class="bottom">
      <canvas id="handview" aria-hidden="true" hidden></canvas>
      <div class="handhint" id="handhint"></div>
      <div class="counter" id="counter"></div>
    </div>
  </section>

  <section id="s-result" class="screen" hidden>
    <div class="res-left">
      <div class="big" id="res-n"></div>
      <div class="res-sub" id="res-sub"></div>
      <div class="milestone" id="res-milestone" hidden></div>
    </div>
    <div class="res-right">
      <div class="res-lead" id="res-lead"></div>
      <div class="bars" id="res-bars"></div>
    </div>
    <div class="timer" id="res-timer"></div>
  </section>

  <section id="s-setup" class="screen" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="11" width="14" height="9"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <p>スタッフをお呼びください</p>
  </section>

  <div id="warn" hidden>
    <div class="warn-n" id="warn-n"></div>
    <p>あと<b id="warn-s"></b>秒で最初の画面に戻ります</p>
    <p class="warn-sub">画面またはキーを押すと回答を続けられます</p>
  </div>

  <canvas id="fx"></canvas>
  <div id="dot" aria-hidden="true"></div>
  <div id="ldot" aria-hidden="true" hidden></div>
  <div id="hot" aria-hidden="true"></div>
  <div id="holdbar" aria-hidden="true"></div>
  <div id="handptr" aria-hidden="true" hidden></div>

  <aside id="admin" hidden>
    <h2>状態</h2>
    <dl id="admin-info"></dl>

    <h2>設定</h2>
    <button class="sw" role="switch" data-a="test"><span><b>テストモード</b><small>ON の間の回答は集計に含めない</small></span><i></i></button>
    <button class="sw" role="switch" data-a="mute"><span><b>効果音</b></span><i></i></button>
    <button class="sw" role="switch" data-a="hand"><span><b>カメラ操作</b></span><i></i></button>
    <div class="row">
      <b>決定の方法</b>
      <div class="seg" role="radiogroup" aria-label="決定の方法" data-a="handsel">
        <button role="radio" data-v="pinch">つまむ</button><button role="radio" data-v="dwell">手を止める</button>
      </div>
    </div>
    <div class="row">
      <b>映像</b>
      <div class="seg" role="radiogroup" aria-label="映像" data-a="handview">
        <button role="radio" data-v="skeleton">骨格</button><button role="radio" data-v="mirror">鏡</button><button role="radio" data-v="none">なし</button>
      </div>
    </div>

    <h2>操作</h2>
    <div class="admin-btns">
      <button data-a="flush">今すぐ送信</button>
      <button data-a="dir">CSV保存先を選ぶ</button>
      <button data-a="csv">CSVを書き出す</button>
      <button data-a="json">JSONを書き出す</button>
      <button data-a="device">端末名を変える</button>
      <button data-a="token" class="danger">トークンを消去</button>
    </div>
    <button data-a="close" class="close">閉じる</button>
  </aside>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script type="module" src="hand.js" onerror="FEST.handState('error', 'MediaPipe の読み込みに失敗')"></script>
</body>
</html>
